<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KP Rose Valley School</title>

<!-- FAVICON -->
<link rel="icon" type="image/png" sizes="48x48" href="/apple-touch-icon.png">
<link rel="shortcut icon" type="image/png" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- CANONICAL -->
<link rel="canonical" href="https://kprosevalleyschool.edu.in/">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#f4f8ff;
overflow-x:hidden;
}

/* LOADER */
#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#001a4d,#00359e,#0060ff);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999999;
transition:.8s;
}

#loader img{
width:110px;
height:110px;
border-radius:50%;
background:#fff;
padding:8px;
animation:pulse 1.5s infinite;
}

#loader h1{
color:#fff;
font-size:30px;
margin-top:15px;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

/* NOTICE */
.notice{
height:48px;
background:linear-gradient(90deg,#ffd000,#ffae00);
display:flex;
align-items:center;
font-size:16px;
font-weight:700;
color:#111;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* MENU BUTTON */
.hamburger{
position:fixed;
top:60px;
right:18px;
z-index:99999;
cursor:pointer;
background:#fff;
padding:12px 10px;
border-radius:16px;
box-shadow:0 12px 25px rgba(0,0,0,.15);
}

.hamburger span{
display:block;
width:34px;
height:4px;
margin:6px 0;
border-radius:20px;
background:linear-gradient(45deg,#003cff,#00aaff);
transition:.4s;
}

.hamburger:hover span:nth-child(1){
transform:translateX(-4px);
}

.hamburger:hover span:nth-child(3){
transform:translateX(4px);
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
backdrop-filter:blur(4px);
display:none;
z-index:9998;
}

.overlay.show{
display:block;
}

/* RIGHT MENU */
.sidebar{
position:fixed;
top:0;
right:-360px;
width:320px;
height:100%;
background:linear-gradient(180deg,#001a4d,#00359e,#005eff);
z-index:99999;
padding:30px;
transition:.45s ease;
box-shadow:-20px 0 35px rgba(0,0,0,.28);
overflow:auto;
}

.sidebar.active{
right:0;
}

.menu-top{
display:flex;
align-items:center;
gap:12px;
margin-bottom:30px;
padding-bottom:20px;
border-bottom:1px solid rgba(255,255,255,.18);
}

.menu-top img{
width:52px;
height:52px;
border-radius:50%;
background:#fff;
padding:5px;
}

.menu-top h2{
color:#fff;
font-size:22px;
line-height:1.3;
}

.sidebar a{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:#fff;
font-size:18px;
font-weight:700;
padding:16px 18px;
margin-bottom:12px;
border-radius:16px;
background:rgba(255,255,255,.08);
transition:.35s;
}

.sidebar a i{
width:24px;
text-align:center;
}

.sidebar a:hover{
transform:translateX(-8px);
background:rgba(255,255,255,.18);
}

/* HERO */
.hero{
height:620px;
background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.45)),url('banner.jpeg') center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero-content{
color:#fff;
animation:fadeUp 1.2s ease;
max-width:900px;
}

.hero-content h1{
font-size:68px;
font-weight:900;
line-height:1.15;
margin-bottom:18px;
}

.hero-content p{
font-size:24px;
line-height:1.8;
margin-bottom:30px;
}

.hero-buttons a{
display:inline-block;
margin:8px;
padding:14px 28px;
border-radius:40px;
text-decoration:none;
font-weight:800;
font-size:18px;
transition:.3s;
}

.btn1{
background:#ffd000;
color:#111;
}

.btn2{
background:rgba(255,255,255,.15);
color:#fff;
border:2px solid #fff;
}

.hero-buttons a:hover{
transform:translateY(-5px);
}

/* SECTION */
.section{
padding:85px 7%;
}

.title{
text-align:center;
font-size:54px;
font-weight:900;
color:#083f87;
margin-bottom:14px;
}

.line{
width:95px;
height:5px;
background:#ffb300;
margin:0 auto 55px;
border-radius:30px;
}

</style>

</head>

<body>
