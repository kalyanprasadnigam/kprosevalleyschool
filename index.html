<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#f4f8ff;
overflow-x:hidden;
}

/* LOADER */
#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#001a4d,#00359e,#0060ff);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999999;
transition:.8s;
}

#loader img{
width:110px;
height:110px;
border-radius:50%;
background:#fff;
padding:8px;
animation:pulse 1.5s infinite;
}

#loader h1{
color:#fff;
font-size:30px;
margin-top:15px;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

</style>
